        half_extents_xyz: [0.09, 0.026, 0.025]
      containment_region:
        center_xyz: [0.0, -0.015, -0.17]
        half_extents_xyz: [0.09, 0.07, 0.025]
      support_plane_z: -0.201
      opening_plane:
        point_xyz: [0.0, -0.015, -0.10]
        outward_normal_xyz: [0.0, 0.0, 1.0]
      allowed_support_links: [link_1]
      forbidden_support_links: [link_2, link_3]
      review_evidence:
        - assets/objects/036_cabinet/46653/model_data.json
        - assets/objects/036_cabinet/46653/mobility.urdf
        - envs/put_object_cabinet.py
        - if_benchmark/data/pair_validation/renders/canonical_skill/cabinet_exposed_entry_diagnostics_20260727/open_ratio060/manifest.json
