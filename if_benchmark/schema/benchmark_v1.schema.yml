$defs:
  Identifier: &id002
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_\-]*$
  RoleId: &id001
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_]*$
  EntityKey: &id004
    type: string
    pattern: ^obj_[A-Za-z0-9_]+$
  ModelId: &id003
    oneOf:
    - type: string
    - type: integer
  AxisSpec: &id006
    type: object
    required:
    - axis
    properties:
      axis:
        enum:
        - D1a
        - D1b
        - D1c
        - D2a
        - D2b
        - D4
      subtype:
        type: string
      role:
        type: string
      value: {}
      values: {}
    additionalProperties: false
  AxisPlan:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/AxisSpec'
  Role:
    type: object
    required:
    - id
    - kind
    properties:
      id: *id001
      kind:
        type: string
      allowed_asset_roles:
        type: array
        items:
          type: string
      descriptor_role:
        type: string
      cardinality:
        type: integer
        minimum: 1
      semantic_tags:
        type: array
        items:
          type: string
      required_uses:
        type: array
        items:
          type: string
      layout_role:
        type: string
    additionalProperties: false
  Constraint:
    type: object
    required:
    - id
    - type
    - scope
    - phase
    - roles
    - params
    - hard
    properties:
      id: *id002
      type:
        type: string
      scope:
        enum:
        - semantic
        - asset
        - unit
        - layout
        - gate
      phase:
        enum:
        - assignment
        - unit_build
        - layout
        - gate
        - manifest
      roles:
        type: array
        items: *id001
      params:
        type: object
      hard:
        type: boolean
      related_constraint: *id002
    additionalProperties: false
  ConstraintIndex:
    type: object
    required:
    - by_phase
    - by_scope
    properties:
      by_phase:
        type: object
        additionalProperties:
          type: array
          items: *id002
      by_scope:
        type: object
        additionalProperties:
          type: array
          items: *id002
    additionalProperties: false
  Action:
    type: object
    required:
    - verb
    properties:
      verb:
        type: string
        minLength: 1
      family:
        type: string
        minLength: 1
      arm:
        type:
        - string
        - 'null'
      relation:
        type:
        - string
        - 'null'
      state:
        type:
        - string
        - 'null'
    additionalProperties: false
  DescriptorConstructor:
    type: object
    required:
    - kind
    properties:
      kind:
        enum:
        - attribute
        - spatial
        - ordinal
        - part
      subtype:
        type: string
      basis:
        type: string
      order:
        type: string
      predicates:
        type: array
        items:
          type: string
      source_role: *id001
      reference_role: *id001
      params:
        type: object
    additionalProperties: false
    allOf:
    - if:
        properties:
          kind:
            const: attribute
      then:
        required:
        - subtype
        - source_role
        not:
          anyOf:
          - required:
            - basis
          - required:
            - order
          - required:
            - predicates
          - required:
            - reference_role
    - if:
        properties:
          kind:
            const: spatial
      then:
        required:
        - predicates
        - source_role
        - reference_role
        properties:
          predicates:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
        not:
          anyOf:
          - required:
            - subtype
          - required:
            - basis
          - required:
            - order
    - if:
        properties:
          kind:
            const: ordinal
      then:
        required:
        - basis
        - order
        - source_role
        not:
          anyOf:
          - required:
            - subtype
          - required:
            - predicates
    - if:
        properties:
          kind:
            const: part
      then:
        required:
        - source_role
        - params
        properties:
          params:
            type: object
            required:
            - region
            properties:
              region:
                type: string
                minLength: 1
              metadata:
                type: object
            additionalProperties: false
        not:
          anyOf:
          - required:
            - subtype
          - required:
            - basis
          - required:
            - order
          - required:
            - predicates
          - required:
            - reference_role
  VariantSchema:
    type: object
    required:
    - id
    - action
    - role_bindings
    properties:
      id: *id002
      action:
        $ref: '#/$defs/Action'
      role_bindings:
        type: object
        minProperties: 1
        propertyNames: *id002
        additionalProperties: *id001
      descriptors:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          items:
            $ref: '#/$defs/DescriptorConstructor'
      params:
        type: object
    additionalProperties: false
  MinimalPairEdge:
    type: object
    required:
    - from
    - to
    - axis
    properties:
      from: *id002
      to: *id002
      axis:
        enum:
        - D1a
        - D1b
        - D1c
        - D2a
        - D2b
        - D4
      subtype:
        type: string
      value: {}
    additionalProperties: false
  Archetype:
    type: object
    required:
    - id
    - roles
    - constraints
    - variant_schemas
    - minimal_pair_edges
    properties:
      id: *id002
      roles:
        type: array
        items:
          $ref: '#/$defs/Role'
      constraints:
        type: array
        items:
          $ref: '#/$defs/Constraint'
      constraint_index:
        $ref: '#/$defs/ConstraintIndex'
      variant_schemas:
        type: array
        items:
          $ref: '#/$defs/VariantSchema'
      minimal_pair_edges:
        type: array
        items:
          $ref: '#/$defs/MinimalPairEdge'
      merge_role:
        type: boolean
      provenance:
        $ref: '#/$defs/Provenance'
    additionalProperties: false
  RoleGraph:
    type: object
    required:
    - id
    - roles
    - constraints
    - variant_schemas
    - minimal_pair_edges
    properties:
      id: *id002
      roles:
        type: array
        items:
          $ref: '#/$defs/Role'
      constraints:
        type: array
        items:
          $ref: '#/$defs/Constraint'
      constraint_index:
        $ref: '#/$defs/ConstraintIndex'
      variant_schemas:
        type: array
        items:
          $ref: '#/$defs/VariantSchema'
      minimal_pair_edges:
        type: array
        items:
          $ref: '#/$defs/MinimalPairEdge'
      provenance:
        $ref: '#/$defs/Provenance'
    additionalProperties: false
  AbstractSceneFamily:
    type: object
    required:
    - id
    - axis_plan
    - archetypes
    - randomization
    properties:
      id: *id002
      axis_plan:
        $ref: '#/$defs/AxisPlan'
      archetypes:
        type: array
        items: *id002
      randomization:
        type: object
      role_graph_id: *id002
      provenance:
        $ref: '#/$defs/Provenance'
    additionalProperties: false
  AssetBinding:
    type: object
    required:
    - asset
    - model_id
    - category
    properties:
      asset:
        type: string
      model_id: *id003
      category:
        type: string
      roles:
        type: array
        items:
          type: string
    additionalProperties: false
  ProvenFact:
    type: object
    required:
    - constraint
    - fact
    properties:
      constraint: *id002
      fact:
        type: string
        minLength: 1
      stage:
        type: string
      status:
        type: string
      metadata:
        type: object
    additionalProperties: false
  EvidenceRef:
    type: object
    required:
    - kind
    properties:
      kind:
        type: string
        minLength: 1
      path:
        type: string
      record_id:
        type: string
      hash:
        type: string
      asset:
        type: string
      model_id: *id003
      field:
        type: string
      use:
        type: string
      relation:
        type: string
      stage:
        type: string
      status:
        type: string
      metadata:
        type: object
    additionalProperties: false
  ProvenanceSource:
    type: object
    required:
    - kind
    - hash
    properties:
      kind:
        type: string
        minLength: 1
      hash:
        type: string
        minLength: 1
      path:
        type: string
      record_id:
        type: string
      metadata:
        type: object
    additionalProperties: false
  Provenance:
    type: object
    required:
    - generator
    - config_hash
    - sources
    properties:
      generator:
        type: string
        minLength: 1
      config_hash:
        type: string
        minLength: 1
      sources:
        type: array
        items:
          $ref: '#/$defs/ProvenanceSource'
      metadata:
        type: object
    additionalProperties: false
  AssignmentCandidate:
    type: object
    required:
    - id
    - abstract_family_id
    - archetype_ids
    - roles
    - resolved_values
    - proven_facts
    - evidence_refs
    - layout_requirements
    - materialization_params
    properties:
      id: *id002
      abstract_family_id: *id002
      archetype_ids:
        type: array
        items: *id002
      roles:
        type: object
        minProperties: 1
        propertyNames: *id001
        additionalProperties:
          $ref: '#/$defs/AssetBinding'
      resolved_values:
        type: object
        propertyNames: *id001
      proven_facts:
        type: array
        items:
          $ref: '#/$defs/ProvenFact'
      evidence_refs:
        type: array
        items:
          $ref: '#/$defs/EvidenceRef'
      layout_requirements:
        type: array
        items:
          type: object
      materialization_params:
        type: object
      provenance:
        $ref: '#/$defs/Provenance'
    additionalProperties: false
  AttributeDescriptor:
    type: object
    required:
    - subtype
    - value
    properties:
      subtype:
        type: string
      value:
        type: string
    additionalProperties: false
  SpatialDescriptor:
    type: object
    required:
    - predicates
    - reference
    properties:
      predicates:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      reference: *id004
    additionalProperties: false
  OrdinalDescriptor:
    type: object
    required:
    - basis
    - order
    properties:
      basis:
        type: string
      order:
        type: string
      reference: *id004
    additionalProperties: false
  PartDescriptor:
    type: object
    required:
    - region
    properties:
      region:
        type: string
    additionalProperties: false
  DescriptorBundle: &id005
    type: object
    minProperties: 1
    properties:
      attribute:
        $ref: '#/$defs/AttributeDescriptor'
      spatial:
        $ref: '#/$defs/SpatialDescriptor'
      ordinal:
        $ref: '#/$defs/OrdinalDescriptor'
      part:
        $ref: '#/$defs/PartDescriptor'
    additionalProperties: false
  DescriptorSet:
    type: object
    properties:
      subject: *id005
      target: *id005
      subject2: *id005
      target2: *id005
    additionalProperties: false
  OrientationAdjustmentParams:
    type: object
    required:
    - orientation_axis
    - orientation_reference
    - rotation_delta_deg
    properties:
      orientation_axis:
        const: support_normal
      orientation_reference:
        const: initial_orientation
      rotation_delta_deg:
        type: integer
        enum:
        - -90
        - -60
        - -45
        - -30
        - 30
        - 45
        - 60
        - 90
    additionalProperties: false
  ConcreteGoal:
    type: object
    required:
    - verb
